name: AAX signing watchdog

# After a plug-in release, its macOS AAX is signed on Samuel's Mac (PACE signing needs his iLok) by the job
# bundle/install-aax-signer.sh installs, then notarised and published by the Notarise AAX workflow. This
# waits for "<Name>-<version>-macOS-AAX.zip" to appear on the release and fails if it hasn't within
# WAIT_MINUTES, so a missed signing shows up as a failed run (and a GitHub email) instead of going unnoticed.
# Windows AAX are signed on Samuel's Windows PC (wraptool can only sign Windows binaries on Windows); once
# that's set up, the repository variable AAX_WINDOWS_SIGNING=true makes this also wait for
# "<Name>-<version>-Windows-AAX.zip".
on:
  workflow_run:
    # Must match the plug-in workflows' "name:" lines.
    workflows:
      - Build and Release Swooshbuckler
      - Build and Release Sound Advice
      - Build and Release Subbertone
      - Build and Release Pitch Flattener
      - Build and Release Reversinator
      - Build and Release Roarschach
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  WAIT_MINUTES: 30
  WINDOWS: ${{ vars.AAX_WINDOWS_SIGNING == 'true' }}

jobs:
  wait:
    # Only tagged releases that built and published (tags look like <plugin>-v1.2.3).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_branch, '-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.workflow_run.head_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
    - name: Wait for the signed AAX
      run: |
        artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')
        if ! grep -q -- '-macOS-AAX-unsigned$' <<< "$artifacts"; then
          echo "The $TAG build made no macOS AAX: nothing to wait for."
          exit 0
        fi
        wanted=('-macOS-AAX\.zip$')
        [[ "$WINDOWS" == "true" ]] && wanted+=('-Windows-AAX\.zip$')
        deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
        while :; do
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          missing=()
          for w in "${wanted[@]}"; do grep -q -- "$w" <<< "$assets" || missing+=("$w"); done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "Published:"; grep -E -- '-(macOS|Windows)-AAX\.zip$' <<< "$assets"
            exit 0
          fi
          if (( $(date +%s) >= deadline )); then
            for w in "${missing[@]}"; do
              case "$w" in
                *macOS*)
                  if grep -q -- '-macOS-AAX-unnotarized\.zip$' <<< "$assets"; then
                    echo "::error::$TAG's macOS AAX was signed but not published within $WAIT_MINUTES min: check the Notarise AAX workflow."
                  else
                    echo "::error::$TAG's macOS AAX wasn't signed within $WAIT_MINUTES min. On the Mac with the iLok, check ~/Library/Logs/SammyJ-AAX-Signer.log or run bundle/sign-aax.sh."
                  fi ;;
                *Windows*)
                  echo "::error::$TAG's Windows AAX wasn't signed within $WAIT_MINUTES min. On the Windows PC, check the AAX signing task's log or run its signing script." ;;
              esac
            done
            exit 1
          fi
          sleep 60
        done
