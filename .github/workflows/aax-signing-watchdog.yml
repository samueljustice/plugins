name: AAX signing watchdog

# After a plug-in release, its macOS AAX is signed on Samuel's Mac (PACE signing needs his iLok) by the job
# bundle/install-aax-signer.sh installs, then notarised and published by the Notarise AAX workflow. This
# waits for "<Name>-<version>-macOS-AAX.zip" to appear on the release and fails if it hasn't within
# WAIT_HOURS, so a missed signing shows up as a failed run (and a GitHub email) instead of going unnoticed.
on:
  workflow_run:
    # Must match the plug-in workflows' "name:" lines.
    workflows:
      - Build and Release Swooshbuckler
      - Build and Release Sound Advice
      - Build and Release Subbertone
      - Build and Release Pitch Flattener
      - Build and Release Reversinator
      - Build and Release Roarschach
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  WAIT_HOURS: 4

jobs:
  wait:
    # Only tagged releases that built and published (tags look like <plugin>-v1.2.3).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_branch, '-v')
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.workflow_run.head_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
    - name: Wait for the signed AAX
      run: |
        artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')
        if ! grep -q -- '-macOS-AAX-unsigned$' <<< "$artifacts"; then
          echo "The $TAG build made no macOS AAX: nothing to wait for."
          exit 0
        fi
        deadline=$(( $(date +%s) + WAIT_HOURS * 3600 ))
        seen_upload=""
        while :; do
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if grep -q -- '-macOS-AAX\.zip$' <<< "$assets"; then
            echo "Published: $(grep -- '-macOS-AAX\.zip$' <<< "$assets")"
            exit 0
          fi
          if [[ -z "$seen_upload" ]] && grep -q -- '-macOS-AAX-unnotarized\.zip$' <<< "$assets"; then
            seen_upload=1
            echo "$(date -u +%H:%M) Signed AAX uploaded; waiting for the Notarise AAX workflow."
          fi
          if (( $(date +%s) >= deadline )); then
            if [[ -n "$seen_upload" ]]; then
              echo "::error::$TAG's AAX was signed but not published within $WAIT_HOURS h: check the Notarise AAX workflow."
            else
              echo "::error::$TAG's macOS AAX wasn't signed within $WAIT_HOURS h. On the Mac with the iLok, run bundle/sign-aax.sh (or check ~/Library/Logs/SammyJ-AAX-Signer.log)."
            fi
            exit 1
          fi
          sleep 120
        done
