name: Build and Release Tonal Recall

# Push a tag like tonalrecall-v1.2.0 to build, sign, notarise and publish a release.
# The version lives in tonalrecall/CMakeLists.txt (TONALRECALL_VERSION); the tag must match it,
# so a mis-tagged release fails early. It ends up in the About panel, the bundles and the installers.
# Run it by hand (workflow_dispatch) to get the same artefacts without a release.
# Pull requests that touch Tonal Recall (or the shared common/ and cmake/ folders it builds from)
# build, test, sign and package too (no release), so problems show up before a tag is pushed.
#
# Tonal Recall reads files outside its folder (pitchflattener/Resources/Fonts/, common/, cmake/),
# so every job uses a full checkout. Rubber Band 4.0.0 is built as a static library into
# SDK/rubberband-4.0.0/lib/librubberband.a, where tonalrecall/CMakeLists.txt looks for it.
#
# Secrets (the same ones the other plug-ins use):
#   APPLE_DEVELOPER_CERTIFICATE_P12_BASE64, APPLE_DEVELOPER_CERTIFICATE_PASSWORD
#     a .p12 holding BOTH "Developer ID Application" and "Developer ID Installer"
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID   for notarisation
# Optional, for the unsigned AAX build (.github/actions/aax-sdk):
#   AAX_SDK_DEPLOY_KEY   read-only deploy key for the private AAX SDK repository
# The AAX is uploaded as an unsigned build artifact only: PACE signing is done later by hand,
# and it is never attached to the release.

on:
  push:
    tags:
      - 'tonalrecall-v*'
  pull_request:
    paths:
      - 'tonalrecall/**'
      - 'common/**'
      - 'cmake/**'
      - '.github/workflows/build-release_tonalrecall.yml'
  workflow_dispatch:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: tonalrecall-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: read   # the release changelog reads Tonal Recall's pull request titles

env:
  JUCE_VERSION: 8.0.8

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
    - uses: actions/checkout@v5
    - name: Read and check the version
      id: v
      run: |
        VERSION=$(sed -n 's/^set(TONALRECALL_VERSION "\([0-9.]*\)".*/\1/p' tonalrecall/CMakeLists.txt)
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not read a version like 1.2.3 from tonalrecall/CMakeLists.txt (got '$VERSION')"
          exit 1
        fi
        if [[ "$GITHUB_REF" == refs/tags/tonalrecall-v* ]]; then
          TAG_VERSION="${GITHUB_REF#refs/tags/tonalrecall-v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match CMakeLists.txt version $VERSION"
            exit 1
          fi
        fi
        echo "Version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup JUCE
      run: |
        mkdir SDK
        git clone --depth 1 --branch $env:JUCE_VERSION https://github.com/juce-framework/JUCE.git SDK/JUCE

    - name: Setup Python and Meson
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install Meson and Ninja
      run: pip install meson ninja

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3

    - name: Download and Build Rubberband
      shell: pwsh
      run: |
        cd SDK
        git clone https://github.com/breakfastquay/rubberband.git rubberband-4.0.0
        cd rubberband-4.0.0
        git checkout v4.0.0

        # --vsenv makes Meson locate and activate MSVC itself (no hard-coded vcvars path,
        # which breaks whenever the runner image's Visual Studio edition/version changes)
        # Force MSVC even though the runner has MinGW gcc (Strawberry) on PATH
        $env:CC = "cl"; $env:CXX = "cl"
        # Static C runtime (/MT), to match Tonal Recall's CMAKE_MSVC_RUNTIME_LIBRARY; the dynamic
        # one (md) would fail to link with LNK2038.
        meson setup build --vsenv --buildtype=release --default-library=static -Db_vscrt=mt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        meson compile -C build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # The static library name differs between Meson versions; find it instead of guessing
        $lib = Get-ChildItem build -Recurse -File | Where-Object { $_.Name -match '^(lib)?rubberband(-static)?\.(lib|a)$' } | Select-Object -First 1
        if (-not $lib) { Write-Error "Rubber Band static library not found"; Get-ChildItem build -Recurse -File | Select-Object FullName; exit 1 }
        Write-Host "Using $($lib.FullName)"
        New-Item -ItemType Directory -Force -Path lib | Out-Null
        Copy-Item $lib.FullName lib\librubberband.a

    - name: Get the AAX SDK
      id: aax
      uses: ./.github/actions/aax-sdk
      with:
        deploy-key: ${{ secrets.AAX_SDK_DEPLOY_KEY }}

    - name: Configure CMake
      run: |
        cd tonalrecall
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release `
          -DTONALRECALL_VERSION="$env:VERSION" `
          -DTONALRECALL_FORMATS="VST3" `
          -DTONALRECALL_TESTS=ON `
          -DSAMMYJ_AAX=ON -DAAX_SDK_PATH="${{ steps.aax.outputs.path }}"

    # Only the plug-in (VST3 and AAX) and the core tests: the editor tests and the listening tools
    # are macOS-only here.
    - name: Build VST3, AAX and core tests
      run: |
        cd tonalrecall
        cmake --build build --config Release --parallel --target TonalRecall_All TonalRecallCoreTests
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run core tests
      run: |
        cd tonalrecall
        $exe = Get-ChildItem build -Recurse -File -Filter TonalRecallCoreTests.exe | Select-Object -First 1
        if (-not $exe) { Write-Error "TonalRecallCoreTests.exe not found"; exit 1 }
        & $exe.FullName
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Unsigned AAX, for testing in Pro Tools Developer only (PACE wraptool signing comes later).
    # It is a build artifact, not part of the release or the installer.
    - name: Zip unsigned Windows AAX
      shell: pwsh
      run: |
        cd tonalrecall
        Compress-Archive -Path "build\TonalRecall_artefacts\Release\AAX\SammyJs Tonal Recall.aaxplugin" -DestinationPath "TonalRecall-Windows-AAX-unsigned.zip" -Force

    - name: Upload unsigned Windows AAX
      uses: actions/upload-artifact@v6
      with:
        name: TonalRecall-Windows-AAX-unsigned
        path: tonalrecall/TonalRecall-Windows-AAX-unsigned.zip
        if-no-files-found: error

    - name: Gather files
      run: |
        cd tonalrecall
        $out = "build\TonalRecall_artefacts\Release"
        New-Item -ItemType Directory -Force -Path windows-package\vst3 | Out-Null
        Copy-Item "$out\VST3\SammyJs Tonal Recall.vst3" windows-package\vst3\ -Recurse
        Get-ChildItem windows-package -Recurse | Select-Object FullName, Length

    - name: Build installer
      run: |
        cd tonalrecall
        choco install innosetup -y --no-progress
        & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DMyAppVersion=$env:VERSION installer.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-Item TonalRecall_Installer.exe

    - name: Upload Windows installer
      uses: actions/upload-artifact@v6
      with:
        name: windows-installer
        path: tonalrecall/TonalRecall_Installer.exe
        if-no-files-found: error

    - name: Upload Windows files
      uses: actions/upload-artifact@v6
      with:
        name: windows-files
        path: tonalrecall/windows-package/
        if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 150 # notarisation can queue; fail fast instead of GitHub's 6 hours
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup JUCE
      run: |
        mkdir SDK
        git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git SDK/JUCE

    - name: Install Dependencies
      run: |
        brew install meson ninja

    - name: Download and Build Rubberband
      run: |
        cd SDK
        curl -L https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2 -o rubberband.tar.bz2
        tar xjf rubberband.tar.bz2
        cd rubberband-4.0.0

        # Universal, with the same minimum macOS as the plug-in
        meson setup build --buildtype=release --default-library=static \
          -Dcpp_args="-arch x86_64 -arch arm64 -mmacosx-version-min=11.0" \
          -Dcpp_link_args="-arch x86_64 -arch arm64 -mmacosx-version-min=11.0"
        meson compile -C build

        # Copy library to expected location
        mkdir lib
        cp build/librubberband.a lib/
        lipo -info lib/librubberband.a

    - name: Get the AAX SDK
      id: aax
      uses: ./.github/actions/aax-sdk
      with:
        deploy-key: ${{ secrets.AAX_SDK_DEPLOY_KEY }}

    - name: Configure CMake
      run: |
        cd tonalrecall
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DTONALRECALL_VERSION="$VERSION" \
          -DTONALRECALL_TESTS=ON \
          -DSAMMYJ_AAX=ON -DAAX_SDK_PATH="${{ steps.aax.outputs.path }}"

    - name: Build AU, VST3, AAX and tests
      run: |
        cd tonalrecall
        # Bounded: a bare --parallel is "make -j" with no limit, which starts every JUCE module at once
        # and can run the 3-core runner out of memory. One job per core.
        cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

    - name: Run core tests
      run: |
        cd tonalrecall
        exe=$(find build -name TonalRecallCoreTests -type f -perm +111 | head -1)
        [ -n "$exe" ] || { echo "TonalRecallCoreTests not found"; exit 1; }
        "$exe"

    # Real processor instances and editor windows. A headless runner can trip over the windows,
    # so a failure here is reported but does not block a release; run it locally before merging.
    - name: Run plug-in tests
      continue-on-error: true
      run: |
        cd tonalrecall
        exe=$(find build -name TonalRecallTests -type f -perm +111 | head -1)
        [ -n "$exe" ] || { echo "TonalRecallTests not found"; exit 1; }
        "$exe" "$RUNNER_TEMP/TonalRecallTests.log"

    # Unsigned AAX, for testing in Pro Tools Developer only (PACE wraptool signing comes later).
    # It is a build artifact: not signed, notarised, packaged or released with the VST3/AU.
    - name: Zip unsigned macOS AAX
      run: |
        cd tonalrecall
        ditto -c -k --keepParent "build/TonalRecall_artefacts/Release/AAX/SammyJs Tonal Recall.aaxplugin" TonalRecall-macOS-AAX-unsigned.zip

    - name: Upload unsigned macOS AAX
      uses: actions/upload-artifact@v6
      with:
        name: TonalRecall-macOS-AAX-unsigned
        path: tonalrecall/TonalRecall-macOS-AAX-unsigned.zip
        if-no-files-found: error

    - name: Check for certificates
      id: check_certs
      run: |
        if [[ -n "${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}" ]]; then
          echo "has_certs=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_certs=false" >> "$GITHUB_OUTPUT"
          echo "No certificates in secrets: the macOS build will be unsigned"
        fi

    - name: Import certificates
      if: steps.check_certs.outputs.has_certs == 'true'
      uses: apple-actions/import-codesign-certs@v6
      with:
        p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
        p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

    - name: Verify certificates
      if: steps.check_certs.outputs.has_certs == 'true'
      run: |
        security find-identity -v -p codesigning | grep -q "Developer ID Application" || { echo "Developer ID Application certificate not found"; exit 1; }
        security find-identity -v -p basic | grep -q "Developer ID Installer" || { echo "Developer ID Installer certificate not found"; exit 1; }
        echo "Both certificates imported"

    - name: Gather bundles
      run: |
        cd tonalrecall
        OUT=build/TonalRecall_artefacts/Release
        mkdir -p staging/vst3 staging/au
        cp -R "$OUT/VST3/SammyJs Tonal Recall.vst3" staging/vst3/
        cp -R "$OUT/AU/SammyJs Tonal Recall.component" staging/au/
        /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "staging/vst3/SammyJs Tonal Recall.vst3/Contents/Info.plist"

    - name: Sign bundles
      if: steps.check_certs.outputs.has_certs == 'true'
      run: |
        cd tonalrecall
        IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
        for b in "staging/vst3/SammyJs Tonal Recall.vst3" "staging/au/SammyJs Tonal Recall.component"; do
          echo "Signing $b"
          codesign --force --sign "$IDENTITY" --timestamp --options runtime --entitlements entitlements.plist "$b"
          codesign --verify --deep --strict --verbose=2 "$b"
        done

    - name: Notarise bundles
      if: steps.check_certs.outputs.has_certs == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        cd tonalrecall/staging
        zip -qry ../notarise-plugins.zip vst3 au
        ID=$(xcrun notarytool submit ../notarise-plugins.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json | jq -r '.id')
        xcrun notarytool wait "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
        STATUS=$(xcrun notarytool info "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json | jq -r '.status')
        if [ "$STATUS" != "Accepted" ]; then
          xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          exit 1
        fi
        # Staple notarization. Fetching the ticket from Apple sometimes drops the connection
        # (stapler error 68), at times for minutes, so retry with a growing pause (30 s, 60 s, ...,
        # about 10 minutes in all) before failing the build.
        staple() {
          local delay=30
          for attempt in 1 2 3 4 5 6 7; do
            if xcrun stapler staple "$1"; then return 0; fi
            echo "Stapling $1 failed (attempt $attempt of 7)"
            if [ "$attempt" -lt 7 ]; then sleep "$delay"; delay=$((delay + 30)); fi
          done
          return 1
        }
        staple "vst3/SammyJs Tonal Recall.vst3"
        staple "au/SammyJs Tonal Recall.component"

    - name: Build installer package
      run: |
        cd tonalrecall
        # Bundles are marked non-relocatable: otherwise Installer "updates" any other copy
        # with the same bundle ID it finds on disk (the AU and VST3 share one) instead of
        # installing into /Library/Audio/Plug-Ins.
        # Package identifiers com.samueljustice.tonalrecall.<kind>; the Sammy J's Plugins installer and uninstaller
        # forget these receipts when they take over or remove the plug-in.
        for kind in vst3 au; do
          if [ "$kind" = "vst3" ]; then location="/Library/Audio/Plug-Ins/VST3"; else location="/Library/Audio/Plug-Ins/Components"; fi
          pkgbuild --analyze --root "staging/$kind" "$kind-components.plist"
          /usr/libexec/PlistBuddy -c "Delete :0:BundleIsRelocatable" "$kind-components.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :0:BundleIsRelocatable bool false" "$kind-components.plist"
          pkgbuild --identifier "com.samueljustice.tonalrecall.$kind" --version "$VERSION" \
            --root "staging/$kind" --component-plist "$kind-components.plist" \
            --install-location "$location" "$kind.pkg"
        done

        cat > distribution.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <installer-gui-script minSpecVersion="2.0">
            <title>Tonal Recall $VERSION</title>
            <organization>com.samueljustice</organization>
            <domains enable_localSystem="true"/>
            <options customize="always" require-scripts="false" hostArchitectures="x86_64,arm64"/>
            <choices-outline>
                <line choice="vst3"/>
                <line choice="au"/>
            </choices-outline>
            <choice id="vst3" title="VST3 plug-in">
                <pkg-ref id="com.samueljustice.tonalrecall.vst3"/>
            </choice>
            <choice id="au" title="Audio Unit plug-in">
                <pkg-ref id="com.samueljustice.tonalrecall.au"/>
            </choice>
            <pkg-ref id="com.samueljustice.tonalrecall.vst3">vst3.pkg</pkg-ref>
            <pkg-ref id="com.samueljustice.tonalrecall.au">au.pkg</pkg-ref>
        </installer-gui-script>
        EOF
        productbuild --distribution distribution.xml --package-path . --version "$VERSION" TonalRecall_Installer.pkg

    - name: Sign installer package
      if: steps.check_certs.outputs.has_certs == 'true'
      run: |
        cd tonalrecall
        INSTALLER_IDENTITY=$(security find-identity -v -p basic | grep "Developer ID Installer" | head -1 | awk -F'"' '{print $2}')
        productsign --sign "$INSTALLER_IDENTITY" --timestamp TonalRecall_Installer.pkg TonalRecall_Installer_Signed.pkg
        mv TonalRecall_Installer_Signed.pkg TonalRecall_Installer.pkg
        pkgutil --check-signature TonalRecall_Installer.pkg

    - name: Notarise installer package
      if: steps.check_certs.outputs.has_certs == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        cd tonalrecall
        f=TonalRecall_Installer.pkg
        ID=$(xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json | jq -r '.id')
        xcrun notarytool wait "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
        STATUS=$(xcrun notarytool info "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json | jq -r '.status')
        if [ "$STATUS" != "Accepted" ]; then
          xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          exit 1
        fi
        # Staple, retried with a growing pause as for the plug-ins (the ticket fetch
        # sometimes drops the connection for minutes).
        delay=30
        for attempt in 1 2 3 4 5 6 7; do
          if xcrun stapler staple "$f"; then break; fi
          if [ "$attempt" -eq 7 ]; then exit 1; fi
          echo "Stapling the installer failed (attempt $attempt of 7), retrying in $delay s"
          sleep "$delay"
          delay=$((delay + 30))
        done
        spctl --assess --type install -vv "$f"

    - name: Zip plug-ins
      run: |
        cd tonalrecall/staging
        ditto -c -k --keepParent "vst3/SammyJs Tonal Recall.vst3" ../TonalRecall-macOS-VST3.zip
        ditto -c -k --keepParent "au/SammyJs Tonal Recall.component" ../TonalRecall-macOS-AU.zip

    - name: Upload macOS files
      uses: actions/upload-artifact@v6
      with:
        name: macos
        path: |
          tonalrecall/TonalRecall_Installer.pkg
          tonalrecall/TonalRecall-macOS-VST3.zip
          tonalrecall/TonalRecall-macOS-AU.zip
        if-no-files-found: error

  create-release:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: Check out release notes
      uses: actions/checkout@v5
      with:
        path: repo
        fetch-depth: 0   # history and tags, for the changelog
        sparse-checkout: tonalrecall/RELEASE_NOTES.md
        sparse-checkout-cone-mode: false

    - name: Changelog
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # This repository releases several plug-ins, so compare with Tonal Recall's own previous release
        # and list only the pull requests that changed Tonal Recall. (GitHub's generated notes would use
        # the newest release of any plug-in and list every plug-in's pull requests.) The base is the newest
        # earlier tag that has a published release: a tag whose release run failed is skipped.
        cd repo
        current="$GITHUB_REF_NAME"
        previous=
        for t in $(git tag --list 'tonalrecall-v*' | sort -V); do
          [ "$t" = "$current" ] && break
          gh release view "$t" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && previous=$t
        done
        cp tonalrecall/RELEASE_NOTES.md ../release_body.md
        if [ -z "$previous" ]; then
          echo "No earlier Tonal Recall release, so no changelog section"
          exit 0
        fi
        prs=$(git log --first-parent --format='%s' "$previous..$current" -- tonalrecall .github/workflows/build-release_tonalrecall.yml \
              | { grep -oE '#[0-9]+' || true; } | tr -d '#' | sort -un)
        {
          echo
          if [ -n "$prs" ]; then
            echo "## What's Changed"
            for n in $prs; do
              gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json title,url --jq '"* \(.title) in \(.url)"' || echo "* #$n"
            done
            echo
          fi
          echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$current"
        } >> ../release_body.md
        tail -n 8 ../release_body.md

    # Everything is downloaded (the unsigned AAX builds too), but only the files copied into
    # release/ by name are attached: the AAX never is.
    - name: Download all artifacts
      uses: actions/download-artifact@v7

    - name: Name the files with the version
      run: |
        mkdir release
        cp macos/TonalRecall_Installer.pkg "release/TonalRecall-$VERSION-macOS-Installer.pkg"
        cp macos/TonalRecall-macOS-VST3.zip "release/TonalRecall-$VERSION-macOS-VST3.zip"
        cp macos/TonalRecall-macOS-AU.zip "release/TonalRecall-$VERSION-macOS-AU.zip"
        cp windows-installer/TonalRecall_Installer.exe "release/TonalRecall-$VERSION-Windows-Installer.exe"
        (cd windows-files/vst3 && zip -qr "../../release/TonalRecall-$VERSION-Windows-VST3.zip" "SammyJs Tonal Recall.vst3")
        ls -la release

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        # The combined Sammy J installer is the "Latest" release, so the README's download links keep working.
        make_latest: false
        name: Tonal Recall ${{ env.VERSION }}
        files: release/*
        body_path: release_body.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
