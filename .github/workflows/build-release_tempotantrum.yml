name: Build and Release Tempo Tantrum

# Tempo Tantrum is a macOS app, not a plug-in: there is no VST3, AU or AAX, so nothing here needs PACE
# signing, and there is no Windows build. It is not in bundle/plugins.txt or the combined installer.
#
# Push a tag like tempotantrum-v0.1.0 to build, test, sign, notarise and publish a release with the app in a
# disk image, TempoTantrum-<version>-macOS.dmg. The version lives in tempotantrum/CMakeLists.txt
# (TEMPOTANTRUM_VERSION); the tag must match it, so a mis-tagged release fails early.
# Run it by hand (workflow_dispatch) for a full dry run: it signs and notarises the same way but makes no
# release, whichever branch or tag it is run on. A pull request that changes Tempo Tantrum, the font it reads from pitchflattener/Resources/Fonts
# or this file runs it too, without a release.
#
# Versions below 1.0.0 are test builds: their releases are pre-releases, so they never become the
# repository's "Latest" (that is the combined Sammy J installer).
#
# Secrets (the same ones the other plug-ins use):
#   APPLE_DEVELOPER_CERTIFICATE_P12_BASE64, APPLE_DEVELOPER_CERTIFICATE_PASSWORD
#     a .p12 holding "Developer ID Application" (only that one is used here)
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID   for notarisation
# Without them (a pull request from a fork, say) the app is built and tested and an unsigned disk image is
# uploaded as a build artifact.
#
#   PTSL_SDK_DEPLOY_KEY   read-only deploy key for the private samueljustice/ptsl-sdk repository, which holds
#     Avid's Pro Tools Scripting SDK (confidential, never in this repository). The build reads it to make
#     Write to Pro Tools' scripting link. Without it the app is built without the link and says so; a
#     release tag without it fails, so a release never ships without the link.

on:
  push:
    tags:
      - 'tempotantrum-v*'
  pull_request:
    paths:
      - 'tempotantrum/**'
      - 'pitchflattener/Resources/Fonts/**'
      - '.github/workflows/build-release_tempotantrum.yml'
      - '.github/actions/ptsl-sdk/**'
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: tempotantrum-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: read   # the release changelog reads Tempo Tantrum's pull request titles

env:
  JUCE_VERSION: 8.0.8

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v5
    - name: Read and check the version
      id: v
      run: |
        VERSION=$(sed -n 's/^set(TEMPOTANTRUM_VERSION "\([0-9.]*\)".*/\1/p' tempotantrum/CMakeLists.txt)
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not read a version like 1.2.3 from tempotantrum/CMakeLists.txt (got '$VERSION')"
          exit 1
        fi
        if [[ "$GITHUB_REF" == refs/tags/tempotantrum-v* ]]; then
          TAG_VERSION="${GITHUB_REF#refs/tags/tempotantrum-v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match CMakeLists.txt version $VERSION"
            exit 1
          fi
        fi
        # Below 1.0.0 is a test build: a pre-release.
        if [[ "$VERSION" == 0.* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
        echo "Version: $VERSION (pre-release: $PRERELEASE)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 120 # notarisation can queue; fail fast instead of GitHub's 6 hours
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DMG: TempoTantrum-${{ needs.version.outputs.version }}-macOS.dmg

    steps:
    - uses: actions/checkout@v5

    - name: Setup JUCE
      run: |
        mkdir SDK
        git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git SDK/JUCE

    # Avid's Pro Tools Scripting SDK, unpacked outside the checkout. Empty without the deploy key.
    - name: Fetch the Pro Tools Scripting SDK
      id: ptsl
      uses: ./.github/actions/ptsl-sdk
      with:
        deploy-key: ${{ secrets.PTSL_SDK_DEPLOY_KEY }}

    - name: Check the Pro Tools Scripting SDK
      env:
        PTSL_SDK: ${{ steps.ptsl.outputs.path }}
      run: |
        if [[ -n "$PTSL_SDK" ]]; then
          echo "Building with the Pro Tools Scripting link"
        elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
          echo "::error::A release tag needs the PTSL_SDK_DEPLOY_KEY secret: a release is never built without the Pro Tools Scripting link"
          exit 1
        else
          echo "::warning::No Pro Tools Scripting SDK: this build has no Pro Tools Scripting link, and Write to Pro Tools works through Accessibility only"
        fi

    - name: Configure CMake
      env:
        PTSL_SDK: ${{ steps.ptsl.outputs.path }}
      run: |
        cd tempotantrum
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DTEMPOTANTRUM_TESTS=ON \
          -DTEMPOTANTRUM_PTSL_SDK="$PTSL_SDK"

    - name: Build the app, the core tests and tt-cli
      run: |
        cd tempotantrum
        # Bounded: a bare --parallel is "make -j" with no limit, which starts every JUCE module at once
        # and can run the 3-core runner out of memory. One job per core.
        cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

    - name: Run core tests
      run: |
        cd tempotantrum
        exe=$(find build -name TempoTantrumCoreTests -type f -perm +111 | head -1)
        [ -n "$exe" ] || { echo "TempoTantrumCoreTests not found"; exit 1; }
        "$exe"

    - name: Run the Pro Tools Scripting client's wire tests
      run: |
        cd tempotantrum
        exe=$(find build -name TempoTantrumPtslTests -type f -perm +111 | head -1)
        [ -n "$exe" ] || { echo "TempoTantrumPtslTests not found"; exit 1; }
        "$exe"

    - name: Gather the app
      run: |
        cd tempotantrum
        app=$(find build -name "Tempo Tantrum.app" -type d -prune | head -1)
        [ -n "$app" ] || { echo "Tempo Tantrum.app not found"; exit 1; }
        mkdir -p staging
        ditto "$app" "staging/Tempo Tantrum.app"
        lipo -info "staging/Tempo Tantrum.app/Contents/MacOS/Tempo Tantrum"
        /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "staging/Tempo Tantrum.app/Contents/Info.plist"

    - name: Check for certificates
      id: check_certs
      run: |
        if [[ -n "${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}" ]]; then
          echo "has_certs=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_certs=false" >> "$GITHUB_OUTPUT"
          echo "No certificates in secrets: the disk image will be unsigned"
          # A release is only ever made from the signed disk image, so a tag stops here.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::A release tag needs the Apple signing secrets: an unsigned app is not released"
            exit 1
          fi
        fi

    - name: Import certificates
      if: steps.check_certs.outputs.has_certs == 'true'
      uses: apple-actions/import-codesign-certs@v6
      with:
        p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
        p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

    - name: Sign the app
      if: steps.check_certs.outputs.has_certs == 'true'
      run: |
        cd tempotantrum
        IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
        [ -n "$IDENTITY" ] || { echo "Developer ID Application certificate not found"; exit 1; }
        codesign --force --sign "$IDENTITY" --timestamp --options runtime --entitlements entitlements.plist "staging/Tempo Tantrum.app"
        codesign --verify --deep --strict --verbose=2 "staging/Tempo Tantrum.app"
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    # The app is notarised and stapled by itself first, so the copy dragged out of the disk image carries
    # its own ticket and opens on a Mac that is offline. (A ticket stapled to a disk image stays on the
    # disk image.) bundle/notarise.sh zips the app to submit it, waits, prints Apple's log if it is refused,
    # and staples with a growing pause between tries (the ticket fetch sometimes drops the connection for
    # minutes).
    - name: Notarise the app
      if: steps.check_certs.outputs.has_certs == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        cd tempotantrum
        ../bundle/notarise.sh "staging/Tempo Tantrum.app"
        xcrun stapler validate "staging/Tempo Tantrum.app"
        spctl --assess --type execute -vv "staging/Tempo Tantrum.app"

    # The app and a link to Applications, so it can be dragged across. (bundle/make-dmg.sh is for the
    # combined installer's .pkg and uninstaller, so it is not used here.)
    - name: Build the disk image
      run: |
        cd tempotantrum
        mkdir -p dmg
        ditto "staging/Tempo Tantrum.app" "dmg/Tempo Tantrum.app"
        ln -s /Applications dmg/Applications
        # hdiutil sometimes fails with "Resource busy" on the hosted runners, so try a few times.
        for attempt in 1 2 3 4 5; do
          if hdiutil create -volname "Tempo Tantrum" -srcfolder dmg -fs HFS+ -format UDZO -ov "$DMG"; then break; fi
          if [ "$attempt" -eq 5 ]; then echo "hdiutil create failed 5 times"; exit 1; fi
          echo "hdiutil create failed (attempt $attempt of 5), retrying"
          sleep 10
        done
        ls -la "$DMG"

    - name: Sign the disk image
      if: steps.check_certs.outputs.has_certs == 'true'
      run: |
        cd tempotantrum
        codesign --force --sign "$IDENTITY" --timestamp "$DMG"
        codesign --verify --verbose=2 "$DMG"

    # The disk image is notarised and stapled too, so opening the download raises no warning either.
    - name: Notarise the disk image
      if: steps.check_certs.outputs.has_certs == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        cd tempotantrum
        ../bundle/notarise.sh "$DMG"
        spctl --assess --type open --context context:primary-signature -vv "$DMG"
        xcrun stapler validate "$DMG"
        # The app as it will be once dragged out of the disk image.
        mnt=$(mktemp -d)
        hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
        xcrun stapler validate "$mnt/Tempo Tantrum.app"
        spctl --assess --type execute -vv "$mnt/Tempo Tantrum.app"
        hdiutil detach "$mnt"

    - name: Upload the disk image
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.check_certs.outputs.has_certs == 'true' && 'macos' || 'macos-unsigned' }}
        path: tempotantrum/${{ env.DMG }}
        if-no-files-found: error

  create-release:
    needs: [version, build-macos]
    runs-on: ubuntu-latest
    # Only a pushed tag makes a release: a run by hand on a tag is still a dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: Check out release notes
      uses: actions/checkout@v5
      with:
        path: repo
        fetch-depth: 0   # history and tags, for the changelog
        sparse-checkout: tempotantrum/RELEASE_NOTES.md
        sparse-checkout-cone-mode: false

    - name: Changelog
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # This repository releases several things, so compare with Tempo Tantrum's own previous release
        # and list only the pull requests that changed it. The base is the newest earlier tag that has a
        # published release: a tag whose release run failed is skipped.
        cd repo
        current="$GITHUB_REF_NAME"
        previous=
        for t in $(git tag --list 'tempotantrum-v*' | sort -V); do
          [ "$t" = "$current" ] && break
          gh release view "$t" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && previous=$t
        done
        cp tempotantrum/RELEASE_NOTES.md ../release_body.md
        if [ -z "$previous" ]; then
          echo "No earlier Tempo Tantrum release, so no changelog section"
          exit 0
        fi
        prs=$(git log --first-parent --format='%s' "$previous..$current" -- tempotantrum .github/workflows/build-release_tempotantrum.yml \
              | { grep -oE '#[0-9]+' || true; } | tr -d '#' | sort -un)
        {
          echo
          if [ -n "$prs" ]; then
            echo "## What's Changed"
            for n in $prs; do
              gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json title,url --jq '"* \(.title) in \(.url)"' || echo "* #$n"
            done
            echo
          fi
          echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$current"
        } >> ../release_body.md
        tail -n 8 ../release_body.md

    # Only the signed disk image (the "macos" artifact) is released. An unsigned build uploads
    # "macos-unsigned" instead, and a tag without the Apple secrets fails in build-macos before this.
    - name: Download the disk image
      uses: actions/download-artifact@v7
      with:
        name: macos
        path: release

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        # The combined Sammy J installer is the "Latest" release, so the README's download links keep working.
        make_latest: false
        # Versions below 1.0.0 are test builds: pre-releases.
        prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
        name: Tempo Tantrum ${{ env.VERSION }}
        files: release/TempoTantrum-${{ env.VERSION }}-macOS.dmg
        fail_on_unmatched_files: true
        body_path: release_body.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
