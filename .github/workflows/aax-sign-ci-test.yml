name: AAX signing test (PACE in CI)

# One-off experiment: can PACE's wraptool sign AAX plug-ins on GitHub's own machines, with iLok cloud
# signing and no iLok or person present? Installs PACE's tools from the private samueljustice/aax-sdk repo,
# signs Reversinator's CI-built AAX on macOS and Windows, verifies it, and uploads the signed bundles as
# artifacts. Publishes nothing.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run ID of a release build with the Reversinator-*-AAX-unsigned artifacts
        default: '42845848641'

permissions:
  contents: read
  actions: read

env:
  PACE_CUSTOMER_NAME: Sweet Justice Sound
  PRODUCT: SammyJs Reversinator

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Get PACE's tools
      uses: actions/checkout@v5
      with:
        repository: samueljustice/aax-sdk
        ssh-key: ${{ secrets.AAX_SDK_DEPLOY_KEY }}
        path: .pace
        sparse-checkout: pace/6.0.2/mac
        persist-credentials: false

    - name: Install License Support and the PACE AAX code signing tools
      run: |
        cd .pace/pace/6.0.2/mac
        cat PACECodeSigningForAAXSDKMac.zip.part-* > PACECodeSigningForAAXSDKMac_v6.0.2_7088da2c.zip
        cat LicenseSupportInstallerMac.zip.part-* > LicenseSupportInstallerMac.zip
        shasum -a 256 -c SHA256SUMS
        for z in LicenseSupportInstallerMac.zip PACECodeSigningForAAXSDKMac_v6.0.2_7088da2c.zip; do
          unzip -q "$z"
        done
        for d in LicenseSupportInstallerMac_*.dmg PACECodeSigningForAAXSDKMac_*.dmg; do
          m="$RUNNER_TEMP/mnt-${d:0:12}"
          mkdir -p "$m"
          hdiutil attach -nobrowse -readonly -mountpoint "$m" "$d" >/dev/null
          for p in "$m"/*.pkg; do echo "Installing $p"; sudo installer -pkg "$p" -target /; done
        done
        WT=$(ls /Applications/PACEAntiPiracy/Eden/Fusion/Versions/*/bin/wraptool | tail -1)
        "$WT" --version
        echo "WRAPTOOL=$WT" >> "$GITHUB_ENV"

    - name: Import the Developer ID certificate
      uses: apple-actions/import-codesign-certs@v6
      with:
        p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
        p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

    - name: Get the unsigned AAX
      run: |
        gh run download "${{ inputs.source_run }}" -R "$GITHUB_REPOSITORY" -n Reversinator-macOS-AAX-unsigned -D dl
        ditto -x -k dl/*.zip aax
        ls aax

    - name: Sign with PACE (cloud signing)
      env:
        PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
        PACE_ILOK_PASSWORD: ${{ secrets.PACE_ILOK_PASSWORD }}
        PACE_CUSTOMER_NUMBER: ${{ secrets.PACE_CUSTOMER_NUMBER }}
      run: |
        IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
        "$WRAPTOOL" sign --verbose --allowsigningservice \
          --account "$PACE_ILOK_ACCOUNT" --pswd-no-save "$PACE_ILOK_PASSWORD" \
          --customernumber "$PACE_CUSTOMER_NUMBER" --customername "$PACE_CUSTOMER_NAME" \
          --productname "$PRODUCT" --signid "$IDENTITY" --dsigharden --dsig1-compat off \
          --in "aax/$PRODUCT.aaxplugin"

    - name: Verify
      run: |
        "$WRAPTOOL" verify --verbose --in "aax/$PRODUCT.aaxplugin"
        codesign --verify --deep --strict --verbose=2 "aax/$PRODUCT.aaxplugin"
        codesign -dv "aax/$PRODUCT.aaxplugin" 2>&1 | grep -E 'flags=|Authority=Developer'

    - uses: actions/upload-artifact@v6
      with:
        name: Reversinator-macOS-AAX-signed-ci-test
        path: aax

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Get PACE's tools
      uses: actions/checkout@v5
      with:
        repository: samueljustice/aax-sdk
        ssh-key: ${{ secrets.AAX_SDK_DEPLOY_KEY }}
        path: .pace
        sparse-checkout: pace/6.0.2/win
        persist-credentials: false

    - name: Install License Support and the PACE AAX code signing tools
      shell: bash
      run: |
        cd .pace/pace/6.0.2/win
        cat PACECodeSigningForAAXSDKWindows.zip.part-* > PACECodeSigningForAAXSDKWindows_v6.0.2_7088da2c.zip
        sha256sum -c SHA256SUMS
        unzip -q PACECodeSigningForAAXSDKWindows_v6.0.2_7088da2c.zip -d sdk
        ls -R sdk | head

    - name: Run the installers (silent)
      shell: pwsh
      run: |
        $sdk = ".pace\pace\6.0.2\win\sdk"
        foreach ($exe in @("$sdk\redist\LicenseSupport.exe", (Get-ChildItem "$sdk\PACECodeSigningForAAXSDKWindows_*.exe").FullName)) {
          Write-Host "Installing $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "/quiet", "/norestart", "/log", "$env:RUNNER_TEMP\$(Split-Path $exe -Leaf).log" -Wait -PassThru
          Write-Host "Exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Get-Content "$env:RUNNER_TEMP\$(Split-Path $exe -Leaf).log" -Tail 60; exit 1 }
        }
        # The installer sets PACE_FUSION_HOME machine-wide; later steps only see it through GITHUB_ENV.
        $fusion = [Environment]::GetEnvironmentVariable("PACE_FUSION_HOME", "Machine")
        Write-Host "PACE_FUSION_HOME=$fusion"
        if ($fusion) { "PACE_FUSION_HOME=$fusion" | Out-File -FilePath $env:GITHUB_ENV -Append }
        $wt = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Recurse -Filter wraptool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $wt) { Write-Host "wraptool.exe not found"; exit 1 }
        Write-Host "wraptool: $($wt.FullName)"
        "WRAPTOOL=$($wt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Import the code-signing certificate
      shell: pwsh
      env:
        PFX_BASE64: ${{ secrets.AAX_WIN_CERT_PFX_BASE64 }}
        PFX_PASSWORD: ${{ secrets.AAX_WIN_CERT_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP "aax-sign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
        # certutil keeps the key in the legacy CryptoAPI provider the .pfx names; wraptool needs that.
        certutil -f -user -p $env:PFX_PASSWORD -importpfx $pfx NoRoot | Out-Null
        Remove-Item $pfx
        $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
        if (-not $cert) { Write-Host "No code-signing certificate imported"; exit 1 }
        Write-Host "Certificate: $($cert.Subject) $($cert.Thumbprint)"
        "SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Get the unsigned AAX
      shell: bash
      run: |
        gh run download "${{ inputs.source_run }}" -R "$GITHUB_REPOSITORY" -n Reversinator-Windows-AAX-unsigned -D dl
        mkdir aax && unzip -q dl/*.zip -d aax
        find aax -maxdepth 4 | head

    - name: Sign with PACE (cloud signing)
      shell: pwsh
      env:
        PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
        PACE_ILOK_PASSWORD: ${{ secrets.PACE_ILOK_PASSWORD }}
        PACE_CUSTOMER_NUMBER: ${{ secrets.PACE_CUSTOMER_NUMBER }}
      run: |
        & $env:WRAPTOOL sign --verbose --allowsigningservice `
          --account $env:PACE_ILOK_ACCOUNT --pswd-no-save $env:PACE_ILOK_PASSWORD `
          --customernumber $env:PACE_CUSTOMER_NUMBER --customername $env:PACE_CUSTOMER_NAME `
          --productname $env:PRODUCT --signid $env:SIGN_THUMBPRINT `
          --in "aax\$env:PRODUCT.aaxplugin"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify
      shell: pwsh
      run: |
        & $env:WRAPTOOL verify --verbose --in "aax\$env:PRODUCT.aaxplugin\Contents\x64\$env:PRODUCT.aaxplugin"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-AuthenticodeSignature "aax\$env:PRODUCT.aaxplugin\Contents\x64\$env:PRODUCT.aaxplugin" | Format-List SignerCertificate, Status, StatusMessage

    - uses: actions/upload-artifact@v6
      with:
        name: Reversinator-Windows-AAX-signed-ci-test
        path: aax
